<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED MARSDOG - Woordenchat Game</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #110925;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin: 0;
      overflow-x: hidden;
    }
    h1.game-title {
      font-size: 2.2rem;
      margin: 10px 0;
      color: #ff4d4d;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff9900;
      letter-spacing: 2px;
      font-weight: 900;
    }
    #game-container {
      background: #1a103c;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 10px 30px rgba(255, 69, 0, 0.3);
      text-align: center;
      border: 2px solid #ff4d4d;
      position: relative;
    }
    .score-board {
      font-size: 1.3rem;
      font-weight: bold;
      color: #fca311;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
    }
    /* Stage & Balanceerkoord */
    #stage {
      position: relative;
      height: 250px;
      background: linear-gradient(to bottom, #090314, #1f1147);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #ff4d4d;
    }
    /* Bewegend Touw */
    #rope {
      position: absolute;
      bottom: 50px;
      left: 5%;
      width: 73%;
      height: 6px;
      background-color: #e5e5e5;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
      animation: ropeSag 2.5s infinite ease-in-out alternate;
    }
    @keyframes ropeSag {
      0% { transform: scaleY(1) translateY(0px); }
      50% { transform: scaleY(1.3) translateY(3px); }
      100% { transform: scaleY(0.9) translateY(-2px); }
    }

    /* Vlammen aan het einde */
    .fire-zone {
      position: absolute;
      right: 2%;
      bottom: 30px;
      width: 90px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .fire-flame {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      font-size: 65px;
      animation: flicker 0.4s infinite alternate ease-in-out;
      transform-origin: bottom center;
      z-index: 1;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 10px #ff4500); }
      100% { transform: scale(1.15) rotate(3deg); filter: drop-shadow(0 0 20px #ffcc00); }
    }

    /* SVG Schattige Mars-Hond Container */
    #marsdog-container {
      position: absolute;
      bottom: 20px;
      right: 30px;
      width: 60px;
      height: 60px;
      z-index: 2;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* SVG Marsmannetje Container */
    #alien-container {
      position: absolute;
      bottom: 52px;
      left: 5%;
      width: 70px;
      height: 90px;
      margin-left: -35px;
      transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.5s ease;
      transform-origin: bottom center;
      user-select: none;
      z-index: 5;
    }

    /* Wankelen bij lopen */
    .walk {
      animation: wobble 0.6s infinite alternate ease-in-out;
    }
    @keyframes wobble {
      0% { transform: rotate(-10deg) translateY(0px); }
      100% { transform: rotate(10deg) translateY(-4px); }
    }

    /* Blijdschapssprong */
    .happy-jump {
      animation: jumpUp 0.8s ease-out !important;
    }
    @keyframes jumpUp {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-70px) scale(1.2) rotate(15deg); }
      100% { transform: translateY(0) scale(1); }
    }

    /* Val bij fout antwoord */
    .fall {
      animation: fallDown 1.3s forwards ease-in;
    }
    @keyframes fallDown {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-35deg) translateY(-15px); }
      100% { transform: rotate(1080deg) translateY(350px); opacity: 0; }
    }

    /* Reddings-Animatie: Hond geknuffeld vóór de marsman */
    .held-dog {
      left: 77% !important;
      bottom: 85px !important;
      z-index: 10 !important;
      transform: scale(1.3) !important;
    }
    .hero-pose {
      left: 77% !important;
      z-index: 8 !important;
      transform: scale(1.3) !important;
    }

    /* Ballonnen Animaties */
    .balloon {
      position: absolute;
      bottom: -80px;
      font-size: 45px;
      z-index: 20;
      animation: floatUp 3s forwards ease-in;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-350px) rotate(20deg); opacity: 0; }
    }

    /* Vragen & Antwoorden */
    .question-box {
      font-size: 1.15rem;
      margin-bottom: 20px;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button.opt-btn {
      background-color: #231553;
      color: white;
      border: 2px solid #ff4d4d;
      padding: 12px 15px;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.opt-btn:hover {
      background-color: #ff4d4d;
      transform: translateY(-2px);
    }
    
    /* Resultaten */
    #result-screen {
      display: none;
    }
    .prize-box {
      background: #231553;
      border: 2px solid #fca311;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
    .restart-btn {
      margin-top: 20px;
      background-color: #fca311;
      color: #110925;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1 class="game-title">🔥 RED MARSDOG 🔥</h1>

<div id="game-container">
  <div class="score-board">
    <span>Vraag: <span id="question-num">1</span> / 40</span>
    <span>Punten: <span id="score">0</span></span>

  <!-- Visueel gedeelte -->
  <div id="stage">
    <div id="rope"></div>
    
    <!-- Vlammenzee -->
    <div class="fire-zone">
      <div class="fire-flame">🔥</div>
    </div>

    <!-- Getekende SCHATTIGE Marshond (SVG) -->
    <div id="marsdog-container">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <!-- Staartje met kwastje -->
        <path d="M 20 55 Q 8 40 18 30" stroke="#ff4d4d" stroke-width="6" fill="none" stroke-linecap="round" />
        <circle cx="17" cy="30" r="5" fill="#76c893" />

        <!-- Grote Schattige Kop -->
        <circle cx="62" cy="38" r="21" fill="#ff4d4d" />
        
        <!-- Flapporen -->
        <path d="M 48 25 Q 35 18 42 42" fill="#e63946" />
        <path d="M 75 25 Q 88 18 81 42" fill="#e63946" />

        <circle cx="56" cy="34" r="4" fill="#1d3557" />

        <circle cx="68" cy="34" r="6" fill="#ffffff" />
        <circle cx="68" cy="34" r="4" fill="#1d3557" />
        <circle cx="66.5" cy="32.5" r="1.5" fill="#ffffff" />

        <circle cx="52" cy="42" r="3" fill="#ff8fa3" opacity="0.8" />
      </svg>
    </div>

    <!-- Getekend Marsmannetje met Aanpasbare Outfits (SVG) -->
    <div id="alien-container" class="walk">
      <svg viewBox="0 0 100 130" width="100%" height="100%">
        <!-- Voelsprieten -->
        <line x1="35" y1="25" x2="25" y2="5" stroke="#76c893" stroke-width="4" stroke-linecap="round" />
        <circle cx="23" cy="5" r="5" fill="#ffb703" />
        
        <line x1="65" y1="25" x2="75" y2="5" stroke="#76c893" stroke-width="4" stroke-linecap="round" />
        <circle cx="77" cy="5" r="5" fill="#ffb703" />

        <!-- Lichaampje -->
        <ellipse cx="50" cy="95" rx="18" ry="22" fill="#52b788" />
        
        <!-- Benen -->
        <line x1="42" y1="112" x2="38" y2="128" stroke="#40916c" stroke-width="5" stroke-linecap="round" />
        <line x1="58" y1="112" x2="62" y2="128" stroke="#40916c" stroke-width="5" stroke-linecap="round" />

        <!-- OUTFIT UPGRADE 2: Tuinbroek (verschijnt bij 30+ vragen) -->
        <g id="overalls" style="display: none;">
          <!-- Broekje -->
          <path d="M 32 90 L 68 90 L 68 112 L 32 112 Z" fill="#2a6f97" />
          <!-- Schouderbanden -->
          <line x1="38" y1="78" x2="40" y2="90" stroke="#014f86" stroke-width="4" />
          <line x1="62" y1="78" x2="60" y2="90" stroke="#014f86" stroke-width="4" />
          <!-- Gele Knopen -->
          <circle cx="40" cy="91" r="2.5" fill="#ffb703" />
          <circle cx="60" cy="91" r="2.5" fill="#ffb703" />
          <!-- Zakje op de borst -->
          <rect x="44" y="94" width="12" height="10" rx="2" fill="#014f86" />
        </g>

        <!-- Balanseer-armen -->
        <path id="arm-left" d="M 33 88 Q 15 80 5 95" stroke="#52b788" stroke-width="5" fill="none" stroke-linecap="round" />
        <path id="arm-right" d="M 67 88 Q 85 80 95 95" stroke="#52b788" stroke-width="5" fill="none" stroke-linecap="round" />

        <!-- Extra GROOT Hoofd -->
        <ellipse cx="50" cy="45" rx="36" ry="30" fill="#76c893" />
        
        <!-- Ogen -->
        <circle cx="36" cy="42" r="11" fill="#ffffff" />
        <circle cx="36" cy="42" r="5" fill="#1d3557" />
        <circle cx="64" cy="42" r="11" fill="#ffffff" />
        <circle cx="64" cy="42" r="5" fill="#1d3557" />

        <!-- Oog-glimmers -->
        <circle cx="34" cy="40" r="2" fill="#ffffff" />
        <circle cx="62" cy="40" r="2" fill="#ffffff" />

        <!-- Mond -->
        <path d="M 40 62 Q 50 72 60 62" stroke="#1d3557" stroke-width="3" fill="none" stroke-linecap="round" />

        <!-- OUTFIT UPGRADE 1: Gekke Feesthoed (verschijnt bij 10+ vragen) -->
        <g id="funny-hat" style="display: none;">
          <!-- Feesthoed punt -->
          <polygon points="50,2 30,22 70,22" fill="#ff0054" />
          <!-- Gele Stippen op de hoed -->
          <circle cx="45" cy="14" r="2.5" fill="#ffb703" />
          <circle cx="55" cy="10" r="2" fill="#ffb703" />
          <circle cx="52" cy="18" r="2" fill="#ffb703" />

          <circle cx="50" cy="2" r="5" fill="#ffb703" />
          <!-- Rand van de hoed -->
          <rect x="26" y="20" width="48" height="4" rx="2" fill="#ffb703" />
        </g>
      </svg>
    </div>
  </div>

  <!-- Speelscherm -->
  <div id="quiz-screen">
    <div class="question-box" id="question">Vraag laden...</div>
    <div class="options-grid" id="options"></div>
  </div>

  <!-- Eindscherm -->
  <div id="result-screen">
    <h2>REDDINGSMISSIE VOLTOOID! 🐾</h2>
    <p>Je hebt in totaal <strong id="final-score">0</strong> punten gehaald!</p>
    <div class="prize-box">
      <h3>Jouw Beloning:</h3>
      <p id="prize-text" style="font-size: 1.2rem; line-height: 1.5;"></p>
    </div>
    <button class="restart-btn" onclick="startGame()">Opnieuw Spelen</button>
  </div>
</div>

    { vraag: "Vul in: 'Na jaren oefenen werd hij een ________ lid van het orkest.'", opties: ["volwaardig", "educatief", "complex", "cursief"], correct: 0 }

  let geselecteerdeVragen = [];
  let huidigeVraagIndex = 0;
  let score = 0;
  let alienPositie = 5;

  function hussel(array) {
    let kopie = [...array];
    for (let i = kopie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
    }
    return kopie;
  }

  function startGame() {
    // Selecteer willekeurig 40 vragen
    const gehusseld = hussel(alleVragenDatabase);
    geselecteerdeVragen = gehusseld.slice(0, 40);

    huidigeVraagIndex = 0;
    score = 0;
    alienPositie = 5;

    document.getElementById('score').innerText = score;
    document.getElementById('question-num').innerText = 1;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';

    // Verberg kleding bij de start
    document.getElementById('funny-hat').style.display = 'none';
    document.getElementById('overalls').style.display = 'none';

    // Reset hond en marsmannetje
    const dog = document.getElementById('marsdog-container');
    dog.className = '';
    dog.style.bottom = '20px';
    dog.style.right = '30px';
    dog.style.left = 'auto';

    resetAlien();
    toonVraag();
  }

  function resetAlien() {
    const alien = document.getElementById('alien-container');
    alien.className = 'walk';
    alien.style.left = alienPositie + '%';
  }

  function toonVraag() {
    document.getElementById('question-num').innerText = huidigeVraagIndex + 1;
    const v = geselecteerdeVragen[huidigeVraagIndex];
    document.getElementById('question').innerHTML = v.vraag;

    // MAAK HET JUISTE ANTWOORD EN DE OPTIES RANDOM (HUSSELEN)
    const juisteTekst = v.opties[v.correct];
    const gehusseldeOpties = hussel(v.opties);
    const nieuwJuistIndex = gehusseldeOpties.indexOf(juisteTekst);

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    gehusseldeOpties.forEach((optie, index) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = optie;
      btn.onclick = () => controleerAntwoord(index === nieuwJuistIndex);
      optionsDiv.appendChild(btn);
    });
  }

  function controleerAntwoord(isCorrect) {
    const alien = document.getElementById('alien-container');

    if (isCorrect) {
      // GOED ANTWOORD
      score += 2;
      document.getElementById('score').innerText = score;

      // Stap vooruit op het koord
      const stapGrootte = 70 / 40;
      alienPositie += stapGrootte;
      alien.style.left = alienPositie + '%';

      const beantwoordAantal = huidigeVraagIndex + 1;

      // KLEDING UPGRADES CHECK
      if (beantwoordAantal >= 10) {
        document.getElementById('funny-hat').style.display = 'block';
      }
      if (beantwoordAantal >= 30) {
        document.getElementById('overalls').style.display = 'block';
      }

      // Check voor Blijdschapssprong + Ballonnen elke 10 vragen
      if (beantwoordAantal % 10 === 0) {
        maakSprongEnBallonnen();
      } else {
        volgendeVraag();
      }
    } else {
      // FOUT ANTWOORD
      alien.className = 'fall';

      setTimeout(() => {
        resetAlien();
        volgendeVraag();
      }, 1300);
    }
  }

  function maakSprongEnBallonnen() {
    const alien = document.getElementById('alien-container');
    alien.classList.add('happy-jump');

    // 2 zwevende ballonnen
    latenBallonZweven('🎈', '30%');
    latenBallonZweven('🎈', '60%');

    setTimeout(() => {
      alien.classList.remove('happy-jump');
      volgendeVraag();
    }, 1200);
  }

  function latenBallonZweven(emoji, xPos) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.innerText = emoji;
    b.style.left = xPos;
    document.getElementById('stage').appendChild(b);

    setTimeout(() => { b.remove(); }, 3000);
  }

  function volgendeVraag() {
    huidigeVraagIndex++;
    if (huidigeVraagIndex < geselecteerdeVragen.length) {
      setTimeout(toonVraag, 300);
    } else {
      setTimeout(speelReddingsAnimatie, 600);
    }
  }

  function speelReddingsAnimatie() {
    const alien = document.getElementById('alien-container');
    const dog = document.getElementById('marsdog-container');

    // Marsmannetje stapt tot in het vuur
    alien.style.left = '77%';

    setTimeout(() => {
      // Hondje wordt opgepakt en VOOR het marsmannetje geknuffeld
      alien.classList.add('hero-pose');
      dog.classList.add('held-dog');

      setTimeout(toonEindscherm, 2000);
    }, 700);
  }

  function toonEindscherm() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').innerText = score;

    let prijs = "";

    if (score >= 80) {
      prijs = "🏆 **MAXIMALE SCORE! (80 PUNTEN)**<br><br>🎉 **Jouw Prijs:** Een keer patat, pannenkoeken, poffertjes, pizza of sushi eten! 🍟🥞🍕🍣";
    } else if (score >= 60) {
      prijs = "🥈 **GEWELDIG! (60+ PUNTEN)**<br><br>📺 **Jouw Prijs:** Een kwartiertje extra TV kijken of gamen! 🎮";
    } else if (score >= 40) {
      prijs = "🥉 **GOED GEDAAN! (40+ PUNTEN)**<br><br>🤗 **Jouw Prijs:** Een dikke vette knuffel van je vader en/of moeder!";
    } else {
      prijs = "💪 **BLIJVEN OEFENEN!**<br><br>Je hebt al een paar punten gehaald! Speel nog een keer om 40 punten of meer te halen voor een mooie prijs!";
    }

    document.getElementById('prize-text').innerHTML = prijs;
  }

  // Start de game
  startGame();
</script>
